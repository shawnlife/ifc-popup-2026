<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>IFC Pop-Up 2026 — Usage</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --orange:#F49404;--bg:#303249;--surface:#3D3F5A;--surface-2:#474A69;
  --text:#fff;--muted:#CDD0E4;--line:rgba(255,255,255,.10);
}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:22px 16px 60px}
h1{margin:0 0 4px;font-size:1.3rem;text-transform:uppercase;letter-spacing:.02em}
.sub{margin:0 0 20px;color:var(--muted);font-size:.85rem}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 22px}
button{
  font-family:inherit;font-size:.8rem;font-weight:700;text-transform:uppercase;
  letter-spacing:.05em;min-height:42px;padding:0 16px;border-radius:999px;cursor:pointer;
  border:1px solid var(--orange);background:var(--orange);color:#241f10;
}
button.ghost{background:none;color:var(--muted);border-color:rgba(255,255,255,.2)}
button.ghost:hover{color:#fff;border-color:#fff}
button:disabled{opacity:.5;cursor:default}
.tiles{display:grid;gap:12px;grid-template-columns:repeat(2,minmax(0,1fr));margin:0 0 22px}
@media(min-width:720px){.tiles{grid-template-columns:repeat(5,minmax(0,1fr))}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.tile b{display:block;font-size:1.7rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:.7rem;text-transform:uppercase;letter-spacing:.09em}
.grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media(min-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.card h2{margin:0 0 12px;font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;
  color:var(--orange)}
.row{display:grid;grid-template-columns:minmax(0,1fr) 46px;gap:10px;align-items:center;
  padding:5px 0}
.row .label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:.85rem}
.row .n{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;font-size:.85rem}
.track{grid-column:1 / -1;height:6px;border-radius:4px;background:rgba(0,0,0,.25);
  overflow:hidden;margin-top:-2px}
.fill{height:100%;background:var(--orange);border-radius:4px}
.empty{color:var(--muted);font-size:.85rem;font-style:italic}
.err{background:#5a2320;border:1px solid #a3413a;border-radius:12px;padding:14px 16px;
  margin:0 0 18px;font-size:.88rem}
.err code{background:rgba(0,0,0,.3);padding:1px 5px;border-radius:4px}
a{color:var(--orange)}
</style>
</head>
<body>
<div class="wrap">
  <h1>IFC Pop-Up 2026 &mdash; Usage</h1>
  <p class="sub" id="sub">Loading&hellip;</p>

  <div class="bar">
    <button id="refresh">Refresh</button>
    <button class="ghost" id="auto">Auto-refresh: on</button>
    <button class="ghost" id="seturl">Change URL</button>
  </div>

  <div id="error"></div>

  <div class="tiles">
    <div class="tile"><b id="t-visits">&mdash;</b><span>Visits</span></div>
    <div class="tile"><b id="t-unique">&mdash;</b><span>Unique loads</span></div>
    <div class="tile"><b id="t-sessions">&mdash;</b><span>Session opens</span></div>
    <div class="tile"><b id="t-speakers">&mdash;</b><span>Profile opens</span></div>
    <div class="tile"><b id="t-tickets">&mdash;</b><span>Ticket clicks</span></div>
  </div>

  <div class="grid">
    <div class="card"><h2>Session demand</h2><div id="c-sessions"></div></div>
    <div class="card"><h2>Speaker interest</h2><div id="c-speakers"></div></div>
    <div class="card"><h2>Tabs used</h2><div id="c-tabs"></div></div>
    <div class="card"><h2>Filters used</h2><div id="c-filters"></div></div>
    <div class="card"><h2>Visits per day</h2><div id="c-byday"></div></div>
    <div class="card"><h2>Most recent hours</h2><div id="c-byhour"></div></div>
  </div>
</div>

<!-- Generated by build_site.py: maps session/speaker ids to readable names, so
     the backend only ever has to store ids. -->
<script src="names.js"></script>
<script>
var NAMES = window.IFC_NAMES || {};
var KEY = 'ifc_analytics_url';

function url(){ return localStorage.getItem(KEY) || ''; }
function askUrl(){
  var v = prompt('Paste the Apps Script web-app URL (ends in /exec):', url() || '');
  if(v){ localStorage.setItem(KEY, v.trim()); load(); }
}

function pretty(s){
  if(NAMES[s]) return NAMES[s];
  return String(s || '(none)')
    .replace(/^session-/, 'Session ')
    .replace(/-/g, ' ')
    .replace(/\b\w/g, function(c){ return c.toUpperCase(); });
}

function bars(el, rows, opts){
  opts = opts || {};
  var host = document.getElementById(el);
  if(!rows || !rows.length){ host.innerHTML = '<p class="empty">Nothing yet.</p>'; return; }
  var list = opts.tail ? rows.slice(-12) : rows.slice(0, 12);
  var max = Math.max.apply(null, list.map(function(r){ return r.count; })) || 1;
  host.innerHTML = list.map(function(r){
    var pct = Math.round(r.count / max * 100);
    var label = opts.raw ? r.name : pretty(r.name);
    return '<div class="row"><div class="label" title="' + esc(label) + '">' +
      esc(label) + '</div><div class="n">' + r.count + '</div>' +
      '<div class="track"><div class="fill" style="width:' + pct + '%"></div></div></div>';
  }).join('');
}

function esc(s){
  return String(s).replace(/[&<>"]/g, function(c){
    return ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' })[c];
  });
}

function sum(rows){
  return (rows || []).reduce(function(a, r){ return a + r.count; }, 0);
}

var timer = null, auto = true;

function load(){
  var u = url();
  var err = document.getElementById('error');
  if(!u){
    err.innerHTML = '<div class="err">No backend URL set yet. Click ' +
      '<b>Change URL</b> and paste the Apps Script web-app URL from ' +
      '<code>SETUP.md</code> step 4.</div>';
    document.getElementById('sub').textContent = 'Not connected.';
    return;
  }
  var btn = document.getElementById('refresh');
  btn.disabled = true; btn.textContent = 'Loading...';
  fetch(u + (u.indexOf('?') > -1 ? '&' : '?') + 'action=summary&fresh=1',
        { redirect: 'follow' })
    .then(function(r){ return r.json(); })
    .then(function(d){
      err.innerHTML = '';
      document.getElementById('t-visits').textContent = d.visits || 0;
      document.getElementById('t-unique').textContent = d.uniqueVisits || 0;
      document.getElementById('t-sessions').textContent = sum(d.sessions);
      document.getElementById('t-speakers').textContent = sum(d.speakers);
      document.getElementById('t-tickets').textContent = (d.clicks && d.clicks.ticket) || 0;
      bars('c-sessions', d.sessions);
      bars('c-speakers', d.speakers);
      bars('c-tabs', d.tabs, { raw: true });
      bars('c-filters', d.filters, { raw: true });
      bars('c-byday', d.byDay, { raw: true, tail: true });
      bars('c-byhour', d.byHour, { raw: true, tail: true });
      document.getElementById('sub').textContent =
        'Updated ' + new Date().toLocaleTimeString() + ' — ' +
        (d.total || 0) + ' events recorded in total.';
    })
    .catch(function(e){
      err.innerHTML = '<div class="err"><b>Could not reach the backend.</b><br>' +
        esc(String(e)) + '<br><br>Usual causes: the web app is not deployed with ' +
        'access set to <b>Anyone</b>, or the URL is wrong (it must end in ' +
        '<code>/exec</code>). If the browser blocks it from a <code>file://</code> ' +
        'page, run <code>python3 -m http.server</code> in this folder and open ' +
        '<code>http://localhost:8000/dashboard.html</code> instead.</div>';
      document.getElementById('sub').textContent = 'Failed to update.';
    })
    .then(function(){ btn.disabled = false; btn.textContent = 'Refresh'; });
}

document.getElementById('refresh').addEventListener('click', load);
document.getElementById('seturl').addEventListener('click', askUrl);
document.getElementById('auto').addEventListener('click', function(){
  auto = !auto;
  this.textContent = 'Auto-refresh: ' + (auto ? 'on' : 'off');
  if(auto){ timer = setInterval(load, 60000); } else { clearInterval(timer); }
});

timer = setInterval(load, 60000);
load();
</script>
</body>
</html>
